[workspace]
name = "ablation-cespgrn"
description = "Ablation benchmark of CeSpGRN"
channels = ["conda-forge"]
platforms = ["linux-64"]  # DAIC only; the environment is used through the Apptainer image
version = "0.1.0"

[system-requirements]
linux = "3.10"  # Older kernel on DAIC
cuda = "12"     # Resolve the CUDA build of PyTorch; it also runs on CPU-only nodes

[tasks]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
scikit-learn = "*"
pandas = "*"
pytorch-gpu = "*"
networkx = "*"     # upstream src/kernel.py
matplotlib = "*"   # imported at the top of upstream src/g_admm.py
umap-learn = "*"   # upstream demo.py
